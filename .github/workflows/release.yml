name: Release Windows executable

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish executable
        shell: pwsh
        run: dotnet publish .\WicJpgXrBenchmark.csproj -c Release -r win-x64 --self-contained true -o .\publish
      - name: Smoke test
        shell: pwsh
        run: |
          & .\publish\WicJpgXrBenchmark.exe --width 64 --height 64 --warmup 0 --iterations 1 --encode --lossless
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package executable
        shell: pwsh
        run: Compress-Archive -Path .\publish\WicJpgXrBenchmark.exe -DestinationPath .\WicJpgXrBenchmark-win-x64.zip
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: WicJpgXrBenchmark-win-x64.zip
          fail_on_unmatched_files: true
